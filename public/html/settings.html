<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wiki Settings</title>
    <link rel="stylesheet" href="../css/settings.css">
    <link rel="icon" href="../images/Wiki Builder Icon.png">
</head>
<body>

    <main>
        <button id="back" onclick="window.location.href='/wiki%20selector'">Back</button>
        <img src="../images/Wiki Builder Logo.png" alt="Logo" id="logo">
        <h1 id="header">Settings</h1>

        <div class="links">
            <a href="/graph">Graph</a>
            <a href="/Links">Links</a>
            <a href="/Page%20Sizes">Page Sizes</a>
            <a href="/chatbot">Wiki AI Assistant</a>
        </div>
        
        <div id="fontSelectorDiv">
            <h1>Font selector</h1>
            <select id="headerFont">
                <option value="" selected></option>
                <option value="Almendra">Almendra</option>
                <option value="Almendra SC">Almendra SC</option>
                <option value="Berkshire Swash">Berkshire Swash</option>
                <option value="Bodoni Moda">Bodoni Moda</option>
                <option value="Cinzel">Cinzel</option>
                <option value="Cormorant Garamond">Cormorant Garamond</option>
                <option value="Eagle Lake">Eagle Lake</option>
                <option value="EB Garamond">EB Garamond</option>
                <option value="Grenze">Grenze</option>
                <option value="Grenze Gotisch">Grenze Gotisch</option>
                <option value="IM FELL English">IM FELL English</option>
                <option value="IM FELL English SC">IM FELL English SC</option>
                <option value="Libre Baskerville">Libre Baskerville</option>
                <option value="Lora">Lora</option>
                <option value="Macondo">Macondo</option>
                <option value="Macondo Swash Caps">Macondo Swash Caps</option>
                <option value="MedievalSharp">MedievalSharp</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Open Sans">Open Sans</option>
                <option value="Oswald">Oswald</option>
                <option value="Pirata One">Pirata One</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Poppins">Poppins</option>
                <option value="Quicksand">Quicksand</option>
                <option value="Raleway">Raleway</option>
                <option value="Roboto">Roboto</option>
                <option value="Ubuntu">Ubuntu</option>
                <option value="Uncial Antiqua">Uncial Antiqua</option>
                <option value="UnifrakturCook">UnifrakturCook</option>
                <option value="UnifrakturMaguntia">UnifrakturMaguntia</option>
            </select>
            <button id="submitFont" onclick="submitFont()">Submit</button>
        </div>
        
        <br><br>

        <div id="imageSettings">
            <h1>Background image</h1>
            <input type="file" id="background-image">

            <h1>Logo</h1>
            <input type="file" id="logo-upload">

            <button id="submitImages" onclick="submitImages()">Submit</button>
        </div>

        <br><br>
        

    </main>

    <script src="../js/settings.js"></script>
</body>
</html>
